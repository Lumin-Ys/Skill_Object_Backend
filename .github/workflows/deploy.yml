name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Pull and restart skill-backend
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "root@${SERVER_IP}" "bash -l -s" << 'ENDSSH'
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

          if ! command -v git >/dev/null 2>&1; then
            dnf install -y git || yum install -y git
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi

          APP_DIR=/root/Skill_Object_Backend
          REPO_URL=https://github.com/Lumin-Ys/Skill_Object_Backend.git
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO_URL" "$APP_DIR"
          fi
          cd "$APP_DIR"
          git remote set-url origin "$REPO_URL"
          git fetch origin main
          git reset --hard origin/main
          npm install --production --ignore-scripts

          if pm2 describe skill-backend >/dev/null 2>&1; then
            pm2 restart skill-backend --update-env
          else
            PORT=3000 pm2 start server.js --name skill-backend --update-env
          fi
          pm2 save || true

          echo "=== local / ==="
          curl -sI http://127.0.0.1:3000/ | head -15
          git log -1 --oneline
          pm2 list
          echo "Deploy completed"
          ENDSSH
