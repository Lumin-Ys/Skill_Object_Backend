name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Switch domain to Skill_Object_Backend
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -euo pipefail
          DOMAIN_NAME="${DOMAIN:-aeladder.store}"
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "root@${SERVER_IP}" \
            "DOMAIN_NAME='${DOMAIN_NAME}' bash -s" << 'ENDSSH'
          set -euo pipefail
          APP_DIR=/root/Skill_Object_Backend
          DOMAIN_NAME="${DOMAIN_NAME:-aeladder.store}"
          REPO_URL=https://github.com/Lumin-Ys/Skill_Object_Backend.git

          if [ ! -d "$APP_DIR/.git" ]; then
            rm -rf "$APP_DIR"
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin "$REPO_URL" || true
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          npm install --omit=dev
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2

          pm2 delete skill-backend || true
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp || true
          fi
          PIDS=$(ss -lntp 2>/dev/null | sed -n 's/.*:3000 .*pid=\([0-9][0-9]*\).*/\1/p' | sort -u || true)
          if [ -n "${PIDS:-}" ]; then
            echo "$PIDS" | xargs -r kill -9 || true
            sleep 1
          fi

          cd "$APP_DIR"
          PORT=3000 pm2 start server.js --name skill-backend --update-env
          pm2 save

          VHOST_FILE=/tmp/${DOMAIN_NAME}.nginx
          printf '%s\n' \
            "server {" \
            "    listen 80;" \
            "    server_name ${DOMAIN_NAME} www.${DOMAIN_NAME};" \
            "    location / {" \
            "        proxy_pass http://127.0.0.1:3000;" \
            "        proxy_http_version 1.1;" \
            "        proxy_set_header Upgrade \$http_upgrade;" \
            "        proxy_set_header Connection \"upgrade\";" \
            "        proxy_set_header Host \$host;" \
            "        proxy_set_header X-Real-IP \$remote_addr;" \
            "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" \
            "        proxy_cache_bypass \$http_upgrade;" \
            "    }" \
            "}" > "$VHOST_FILE"

          mkdir -p /etc/nginx/conf.d
          cp "$VHOST_FILE" "/etc/nginx/conf.d/${DOMAIN_NAME}.conf"

          if [ -d /etc/nginx/sites-available ]; then
            cp "$VHOST_FILE" "/etc/nginx/sites-available/${DOMAIN_NAME}"
            mkdir -p /etc/nginx/sites-enabled
            ln -sfn "/etc/nginx/sites-available/${DOMAIN_NAME}" "/etc/nginx/sites-enabled/${DOMAIN_NAME}"
            rm -f /etc/nginx/sites-enabled/default
          fi

          shopt -s nullglob
          for f in /etc/nginx/conf.d/*.conf /etc/nginx/sites-enabled/*; do
            base=$(basename "$f")
            if [ "$base" = "${DOMAIN_NAME}.conf" ] || [ "$base" = "${DOMAIN_NAME}" ]; then
              continue
            fi
            if grep -q "$DOMAIN_NAME" "$f" 2>/dev/null; then
              mv "$f" "$f.bak-before-skill"
              echo "disabled old vhost: $f"
            fi
          done

          nginx -t
          nginx -s reload || systemctl reload nginx

          echo "=== local / ==="
          curl -sI http://127.0.0.1:3000/ | head -20
          echo "=== git ==="
          git log -1 --oneline
          echo "=== pm2 ==="
          pm2 list
          echo "Deploy completed"
          ENDSSH
