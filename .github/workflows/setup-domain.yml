name: Setup Domain & Deploy

on:
  workflow_dispatch:

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Domain & Deploy
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -euo pipefail
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "root@${SERVER_IP}" "bash -l -s" << 'ENDSSH'
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

          DOMAIN="${DOMAIN:-aeladder.store}"
          APP_DIR=/root/Skill_Object_Backend

          echo "=== 1. 安装 Node.js 和 PM2 ==="
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
            dnf module enable nodejs:18 -y || yum install -y nodejs npm
          fi
          npm install -g pm2

          echo "=== 2. 克隆/更新代码 ==="
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone https://github.com/Lumin-Ys/Skill_Object_Backend.git "$APP_DIR"
          fi
          cd "$APP_DIR"
          git remote set-url origin https://github.com/Lumin-Ys/Skill_Object_Backend.git
          git fetch origin main
          git reset --hard origin/main
          npm install --production --ignore-scripts

          echo "=== 3. 配置 PM2 ==="
          if pm2 describe skill-backend >/dev/null 2>&1; then
            pm2 restart skill-backend --update-env
          else
            PORT=3000 pm2 start server.js --name skill-backend --update-env
          fi
          pm2 save
          pm2 startup

          echo "=== 4. 配置 Nginx 通配符子域名 ==="
          cat > /etc/nginx/sites-available/$DOMAIN << 'NGINX'
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.$DOMAIN$;

    location / {
        proxy_pass http://127.0.0.1:3000/sites/$subdomain/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name $DOMAIN www.$DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /sites/ {
        proxy_pass http://127.0.0.1:3000/sites/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
NGINX

          echo "=== 5. 启用 Nginx 配置 ==="
          ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/
          rm -f /etc/nginx/sites-enabled/default
          nginx -t && systemctl reload nginx

          echo "=== 6. 配置防火墙 ==="
          ufw allow 80/tcp 2>/dev/null || true
          ufw allow 443/tcp 2>/dev/null || true

          echo "=== 7. 等待服务启动 ==="
          sleep 3
          for i in {1..10}; do
            if curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "✅ 服务已就绪"
              break
            fi
            echo "等待服务启动... ($i/10)"
            sleep 2
          done

          echo "=== 8. 验证部署 ==="
          echo "--- 后端状态 ---"
          curl -sI http://127.0.0.1:3000/ | head -5
          echo ""
          echo "--- PM2 日志 ---"
          pm2 logs skill-backend --lines 15 --nostream 2>/dev/null || true
          echo ""
          echo "--- PM2 状态 ---"
          pm2 list
          echo ""
          echo "--- Nginx 状态 ---"
          systemctl status nginx | head -5
          echo ""
          echo "=== ✅ 部署完成 ==="
          echo "🌐 主站: http://$DOMAIN"
          echo "🌐 子域名示例: http://{username}.$DOMAIN"
        ENDSSH
