name: Fix Nginx & Deploy

on:
  workflow_dispatch:

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Nginx and Deploy
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -euo pipefail
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "root@${SERVER_IP}" "bash -l -s" << 'ENDSSH'
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

          DOMAIN="${DOMAIN:-aeladder.store}"

          echo "=== 1. 检查 80 端口占用 ==="
          ss -tlnp | grep :80 || echo "80 端口未被占用"

          echo "=== 2. 停止所有占用 80 端口的服务 ==="
          systemctl stop nginx 2>/dev/null || true
          pkill -f nginx 2>/dev/null || true
          sleep 1

          echo "=== 3. 删除旧 Nginx 配置 ==="
          rm -f /etc/nginx/sites-enabled/*
          rm -f /etc/nginx/sites-available/*

          echo "=== 4. 停止旧 PM2 服务 ==="
          pm2 delete skill-backend 2>/dev/null || true
          pkill -f "node server.js" 2>/dev/null || true
          sleep 2

          echo "=== 5. 克隆/更新代码 ==="
          APP_DIR=/root/Skill_Object_Backend
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone https://github.com/Lumin-Ys/Skill_Object_Backend.git "$APP_DIR"
          fi
          cd "$APP_DIR"
          git remote set-url origin https://github.com/Lumin-Ys/Skill_Object_Backend.git
          git fetch origin main
          git reset --hard origin/main
          npm install --production --ignore-scripts

          echo "=== 6. 启动 PM2 ==="
          PORT=3000 pm2 start server.js --name skill-backend
          pm2 save
          pm2 startup

          echo "=== 7. 配置 Nginx ==="
          cat > /etc/nginx/sites-available/$DOMAIN << 'NGINX'
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.$DOMAIN$;

    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}

server {
    listen 80 default_server;
    server_name $DOMAIN www.$DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /sites/ {
        proxy_pass http://127.0.0.1:3000/sites/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
NGINX

          echo "=== 8. 启用 Nginx ==="
          ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/
          nginx -t && systemctl restart nginx

          echo "=== 9. 配置防火墙 ==="
          ufw allow 80/tcp 2>/dev/null || true
          ufw allow 443/tcp 2>/dev/null || true

          echo "=== 10. 等待服务启动 ==="
          sleep 5
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "✅ 后端服务已就绪"
              break
            fi
            echo "等待后端启动... ($i/15)"
            sleep 2
          done

          echo "=== 11. 验证 ==="
          echo "--- 本地后端 ---"
          curl -s http://127.0.0.1:3000/ | head -5
          echo ""
          echo "--- 主域名访问 ---"
          curl -sI http://127.0.0.1:80/ | head -5
          echo ""
          echo "--- PM2 状态 ---"
          pm2 list
          echo ""
          echo "--- Nginx 状态 ---"
          systemctl status nginx | head -5
          echo ""
          echo "--- Nginx 监听端口 ---"
          ss -tlnp | grep nginx
          echo ""
          echo "=== ✅ 完成 ==="
        ENDSSH
